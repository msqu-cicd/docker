name: 'Docker'
description: 'Build and publish docker images'

inputs:
  docker_auth_json_file:
    description: location of the docker auth json file, relative to home dir or absolute path
    default: ".docker/config.json"

  docker_args:
    description: "Extra arguments to pass to docker invocation"
    default: ""

  tag_prefix:
    description: "a prefix to add to all docker tags"

  tag_suffix:
    description: "a suffix to add to all docker tags"

  tag_commit_enable:
    description: "generate a docker tag from the commit sha"
    default: "true"

  tag_commit_prefix:
    description: "a prefix to add to docker tags that were generated from commit sha"
    default: "commit-"

  tag_ref_normalized_enable:
    description: "generate a tag from the git reference (eg. tag or branch name, skipped if semver was successfully parsed)"
    default: "true"

  tags_additional:
    description: "list of additional tags to add as CSV for each registry configured"

  tag_semver_enable:
    description: "set to false to disable semver tagging completely"
    default: "true"

  tag_semver_major:
    description: "generate a docker tag for the semver major version (eg. 1)"
    default: "true"

  tag_semver_minor:
    description: "generate a docker tag for the semver major.minor version (eg. 1.2)"
    default: "true"

  tag_semver_patch:
    description: "generate a docker tag for the semver major.minor.patch version (eg. 1.2.3)"
    default: "true"

  additional_destinations:
    description: "a list of registry/owner/repo:tag strings, csv separated. These tags are created and pushed as is without modifications like prefix."
    default: ""

  additional_registries:
    description: "list of additional registry/owner/repo targets as CSV, the generated tags are appended to each"
    default: ""

  add_ci_registry_auth:
    description: "add auth for the ci registry (from ci_registry_password) to the docker auth json"
    default: "true"

  add_ci_registry_target:
    description: "add the ci registry repository of the current repo as a build/push target"
    default: "true"

  registry_auth_json:
    description: "additional docker auth json ({\"auths\": {...}}) merged into the generated auth file"
    default: ""

  merge_existing_auth_json:
    description: "if existing registry auth json in .docker/config.json should be merge into the final auth json"
    default: "true"

  squash_layers:
    description: "squash image layers (legacy builder only, buildx/buildkit does not support --squash)"
    default: "true"

  docker_push:
    description: "Push all build tags to destinations"
    default: "true"

  docker_pull:
    description: "Always attempt to pull all referenced images"
    default: "true"

  use_buildx:
    description: "use buildx instead of legacy build"
    default: "true"

  docker_multiarch:
    description: "false to disable, true for linux/amd64,linux/arm64 or an explicit platform list (requires buildx)"
    default: "false"

  dockerfile:
    description: "Dockerfile used to build images"
    default: "Dockerfile"

  docker_context_dir:
    description: "docker build context directory, absolute or relative to the workspace; defaults to the workspace"

  ci_registry_password:
    description: "password/token for default ci registry, should usually be set to secret value with ${{ secrets.someSecretName }} for gitea"
    default: ""
    required: false

  build_args:
    description: "list of docker build args to pass to docker (--build-arg key1=value1) as newline seperated multiline string, eg key1=value1\nkey2=value2"
    default: ""
    required: false

  debug_log_github_context:
    description: "Log github.context as JSON for debugging purposes"
    default: "false"

  debug_log_auth_json:
    description: "WARNING: may leak credentials to logs. Log docker auth.json contents for debugging purposes"
    default: "false"

  debug_log_destinations:
    description: "Log docker build destinations for debugging purposes"
    default: "true"

outputs:
  published_tags:
    description: "Published tags as csv"

runs:
  using: "node20"
  main: ./dist/index.js
